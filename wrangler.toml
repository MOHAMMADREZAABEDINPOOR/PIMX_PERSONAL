name = "pimx-personal-backend"
main = "backend/src/worker.js"
compatibility_date = "2024-01-01"

[vars]
PORT = "3001"
MIN_SERVERS = "100"
MAX_SERVERS = "150"

[[kv_namespaces]]
binding = "SERVERS_DB"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

[build]
command = "npm run build:worker"